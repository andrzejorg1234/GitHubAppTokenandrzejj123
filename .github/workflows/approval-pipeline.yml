name: Deployment with Manual Approval

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: |
          echo "Building application..."
          echo "Build artifact: app-${{ github.sha }}"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Deploy to staging
        run: echo "Deployed to staging"

  test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke tests on staging
        run: |
          echo "Running smoke tests..."
          echo "All tests passed"

  approve-production:
    needs: test-staging
    environment: production-approval
    steps:
      - name: Awaiting approval
        run: echo "Waiting for approval to deploy to production"

  deploy-production:
    needs: approve-production

    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        run: echo "Deployed to production"

  post-deploy:
    needs:
      - build
      - deploy-staging
      - test-staging
      - approve-production
      - deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Verify production
        run: echo "Production smoke tests passed"
      - name: Add job summary
        run: |
          {
            echo "## Pipeline history"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| deploy-staging | ${{ needs.deploy-staging.result }} |"
            echo "| test-staging | ${{ needs.test-staging.result }} |"
            echo "| approve-production | ${{ needs.approve-production.result }} |"
            echo "| deploy-production | ${{ needs.deploy-production.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"